jwt:
  secret-key: ${JWT_SECRET:minha-chave-local}
  expiration: 86400000
file:
  upload-dir: ${UPLOAD_DIR:uploadDir}

spring:
  application:
    name: derecc.dev

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/derecc}
    username: ${PGUSER:root}
    password: ${PGPASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB

server:
  port: ${PORT:8080}