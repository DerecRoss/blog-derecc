file:
  upload-dir: uploadDir
spring:
  application:
    name: derecc.dev

  datasource:
    url: jdbc:postgresql://localhost:5432/derecc
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      format_sql: true
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      enabled: true
      file-size-threshold: 2KB
      max-file-size: 200MB
      max-request-size: 215MB
